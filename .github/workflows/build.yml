name: Tamimystic OS ESP32 Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-native-sim:
    name: Build & Run Automated CTest Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure CMake Native Simulation
        run: cmake -B build -S .

      - name: Compile Native Simulation & Test Suite
        run: cmake --build build --config Release

      - name: Run Automated CTest Unit Tests & Kinematics Benchmarks
        run: ctest --test-dir build --output-on-failure --verbose

  build-esp32:
    name: Build ESP32-S3 Firmware
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.2.1
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Build ESP32-S3 Firmware via ESP-IDF v5.2
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          git config --global --add safe.directory "*"
          idf.py set-target esp32s3
          set -o pipefail
          idf.py build 2>&1 | tee idf_build_log.txt

      - name: Archive Build Log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: esp_idf_build_log
          path: idf_build_log.txt
          if-no-files-found: ignore

      - name: Archive Firmware (BIN & ELF Binaries)
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: tamimystic_os_firmware
          path: |
            build/tamimystic_os.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/tamimystic_os.elf
          if-no-files-found: ignore
