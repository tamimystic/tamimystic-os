site_name: Tamimystic OS Documentation
site_description: The Universal Edge Robotics & AI Operating System for ESP32-S3
site_author: Tamimystic
repo_url: https://github.com/tamimystic/tamimystic-os
repo_name: tamimystic/tamimystic-os
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.mark
  - attr_list
  - md_in_html
  - tables

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - 🏠 Home: index.md
  - 🚀 Getting Started:
    - Overview & Prerequisites: getting-started/index.md
    - Flashing & Installation: getting-started/installation.md
    - First Boot & Web Dashboard: getting-started/first-boot.md
    - 5-Minute Quickstart: getting-started/quickstart.md
  - 🔌 Hardware & Pin Matrix:
    - Dynamic Software Pin Matrix: hardware/pin-matrix.md
    - Plug & Play Sensor Catalog: hardware/pnp-sensors.md
  - 🦾 Robotics Control Engine:
    - Universal Robot Brain: robotics/overview.md
    - Rover & Mecanum Kinematics: robotics/kinematics.md
    - 6-DOF Arm & Inverse Kinematics: robotics/arm-ik.md
  - 🧠 Edge AI & Vision:
    - DVP Camera & PSRAM Streaming: ai-vision/camera.md
    - Onboard Neural Models: ai-vision/neural-models.md
    - Autonomous Visual Tracking: ai-vision/visual-tracking.md
  - 🐍 Python & Application Engine:
    - MicroPython Runtime & APIs: apps/micropython.md
    - In-Browser Web IDE & VFS: apps/web-ide.md
    - Dual-Bank OTA Firmware Update: apps/ota-updates.md
  - 📖 API & CLI Reference:
    - Serial CLI Command Reference: reference/cli.md
    - HTTP REST API Endpoints: reference/rest-api.md
  - 🛠️ Developer Guide:
    - Build from Source (PC & ESP32): development/build.md
    - CI/CD & GitHub Actions: development/cicd.md
